name: CI/CD DEPLOY

on:
  push:
    branches:
      - feat/test-release

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/vps-ai
            # On s'assure que le script a le droit de s'exécuter
            chmod +x deploy.sh
            # On lance le script
            ./deploy.sh










