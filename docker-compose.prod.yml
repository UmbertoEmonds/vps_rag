services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--api.insecure=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/traefik`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=admin:$$apr1$$qy8Tp.bf$$TSlQCd3reDTE3UlMUmO.R0"
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: prod
    image: ghcr.io/umbertoemonds/vps_rag/simplon-rag-api:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: "http://164.132.44.8"
      STORAGE_BUCKET: "simplon-rag-corpus"
      STORAGE_GCS_ENDPOINT_URL: "http://fake-gcs:4443"
      STORAGE_GCS_PROJECT: "local-dev"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    deploy:
      mode: replicated
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    image: ghcr.io/umbertoemonds/vps_rag/simplon-rag-frontend:latest
    environment:
      RAG_API_URL: "http://api:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=8501"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/data/db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: >
      -scheme http -port 4443
      -external-url http://fake-gcs:4443
      -backend filesystem -filesystem-root /data
    volumes:
      - fake_gcs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fake-gcs-init:
    image: curlimages/curl:latest
    depends_on:
      fake-gcs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        curl -sf -X POST 'http://fake-gcs:4443/storage/v1/b?project=local-dev'
          -H 'Content-Type: application/json'
          -d '{\"name\": \"simplon-rag-corpus\"}'
      "
    restart: "no"

volumes:
  pgdata:
  fake_gcs_data:
